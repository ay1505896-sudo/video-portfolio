<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Video Editing Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pro Video Editing</h1>
        <p>सिर्फ 5 घंटे में अपनी रील्स और वीडियो एडिट करवाएं!</p>
    </header>

    <section class="container">
        <h2>मेरा काम (Portfolio)</h2>
        <div class="portfolio-grid">
            <div class="card">
                <img src="https://images.pexels.com/photos/3183150/pexels-photo-3183150.jpeg" alt="Gaming Montage">
                <p>Gaming Montage & Shorts</p>
            </div>
            <div class="card">
                <img src="https://images.pexels.com/photos/3183153/pexels-photo-3183153.jpeg" alt="Ad Design">
                <p>Ad Design & Reels</p>
            </div>
        </div>
    </section>

    <section class="container form-section">
        <h2>ऑर्डर बुक करें</h2>
        <form action="https://formsubmit.co/apka-email@gmail.com" method="POST">
            <label>पूरा नाम (Full Name)</label>
            <input type="text" name="name" required placeholder="अपना नाम लिखें">

            <label>ईमेल (Email)</label>
            <input type="email" name="email" required placeholder="अपनी ईमेल लिखें">

            <label>WhatsApp नंबर</label>
            <input type="tel" name="phone" required placeholder="अपना नंबर लिखें">

            <button type="submit">ऑर्डर भेजें</button>
        </form>
    </section>

</body>
</html>
